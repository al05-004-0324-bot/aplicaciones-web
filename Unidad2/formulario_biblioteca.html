<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Biblioteca</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #eef2f3;
            padding: 40px;
            display: flex;
            justify-content: center;
        }
        .form-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
        }
        h2 {
            color: #2c3e50;
            text-align: center;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .field-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #34495e;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #dcdde1;
            border-radius: 6px;
            box-sizing: border-box;
            transition: border 0.3s;
        }
        input:focus {
            border-color: #3498db;
            outline: none;
        }
        .btn-submit {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            width: 100%;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-submit:hover {
            background-color: #2980b9;
        }
        .hint {
            font-size: 0.8em;
            color: #7f8c8d;
            margin-top: 3px;
        }
    </style>
</head>
<body>

<div class="form-card">
    <h2>Registro de Libros</h2>
    <form action="#">
        
        <div class="field-group">
            <label for="nombre">Nombre del Libro:</label>
            <input type="text" id="nombre" name="nombre" required>
        </div>

        <div class="field-group">
            <label for="autor">Autor o Autores:</label>
            <input type="text" id="autor" name="autor" required>
        </div>

        <div class="field-group">
            <label for="editorial">Editorial:</label>
            <input type="text" id="editorial" name="editorial" required>
        </div>

        <div class="field-group">
            <label for="anio">Año:</label>
            <input type="number" id="anio" name="anio" min="2021" max="2026" value="2021" required>
        </div>

        <div class="field-group">
            <label for="pais">País:</label>
            <select id="pais" name="pais" required>
                <option value="">Seleccione un país</option>
                <option value="MEXICO">MEXICO</option>
                <option value="España">España</option>
                <option value="Cuba">Cuba</option>
            </select>
        </div>

        <div class="field-group">
            <label for="paginas">Páginas:</label>
            <input type="number" id="paginas" name="paginas" min="1" required>
        </div>

        <div class="field-group">
            <label for="precio">Precio (MXN):</label>
            <input type="number" id="precio" name="precio" min="100" step="0.01" placeholder="Mínimo $100" required>
        </div>

        <div class="field-group">
            <label for="edicion">Edición:</label>
            <input type="text" id="edicion" name="edicion" required>
        </div>

        <div class="field-group">
            <label for="sbm">SBM (Patrón Agrónomo):</label>
            <input type="text" id="sbm" name="sbm" 
                   pattern="[A-Z]{3}-[0-9]{4}-[A-Z0-9]{2}" 
                   placeholder="Ej: AGR-2026-X1" 
                   title="Debe seguir el formato de registro técnico (Ej: AGR-2026-X1)" required>
            <p class="hint">Formato sugerido: Prefijo-Año-Clave</p>
        </div>

        <button type="submit" class="btn-submit">Guardar en Biblioteca</button>
    </form>
</div>

</body>
</html>
